stages:
  - lint
  - scan
  - pr_agent

default:
  tags:
    - ai-cicd-demo

# ─── LINT ────────────────────────────────────────────────────────────────────

lint:
  stage: lint
  image: ai-repository.vnpt.vn/vnsocial/python:3.12
  before_script:
    - pip install black==24.4.1 flake8==7.0.0 mypy==1.10.0
  script:
    - black --check src/ tests/
    - flake8 src/ tests/
    - mypy src/ --ignore-missing-imports
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─── SONARQUBE ───────────────────────────────────────────────────────────────

sonarqube:
  stage: scan
  image: ai-repository.vnpt.vn/vnsocial/sonarsource/sonar-scanner-cli:4.6
  retry: 2
  script:
    - sonar-scanner
        -Dsonar.projectKey=$SONAR_PROJECT_KEY
        -Dsonar.sources=.
        -Dsonar.host.url=$SONAR_HOST_URL
        -Dsonar.login=$SONAR_TOKEN
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─── PR AGENT ────────────────────────────────────────────────────────────────

pr_agent_job:
  stage: pr_agent
  image:
    name: ai-repository.vnpt.vn/vnsocial/codingassistant/pr_agent:latest
    entrypoint: [""]
  script:
    - cp $CI_PROJECT_DIR/openai_ai_handler.py /app/pr_agent/algo/ai_handlers/openai_ai_handler.py
    - cd /app
    - echo "Running PR Agent action step"
    - export MR_URL="$CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID"
    - echo "MR_URL=$MR_URL"
    - export gitlab__url=$CI_SERVER_URL
    - export vnpt_scm__PERSONAL_ACCESS_TOKEN=$GITLAB_PERSONAL_ACCESS_TOKEN
    - export config__git_provider="vnpt_scm"
    - export ic_code__key=$IC_CODE_API_KEY
    - export ic_code__base_url=$IC_CODE_BASE_URL
    - python3 -m pr_agent.cli --pr_url="$MR_URL" describe
    - python3 -m pr_agent.cli --pr_url="$MR_URL" review
    - python3 -m pr_agent.cli --pr_url="$MR_URL" improve
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
